name: Sync upstream

on:
  schedule:
    - cron: "13 10 */2 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: github.repository == 'tarciziocarbone/rea-fork'
    runs-on: ubuntu-latest
    steps:
      - name: Sync main with upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/merge-upstream" --field branch=main
